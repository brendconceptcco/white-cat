            border-radius: 50% 50% 40% 40%;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 20px #ffffff, inset 0 0 15px rgba(255,255,255,0.3);
            transition: all 0.4s ease;
        }
        /* Левое ушко */
        .cat-scanner::before {
            content: '';
            position: absolute;
            top: -20px; left: 10px;
            width: 0; height: 0;
            border-left: 25px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 35px solid #ffffff;

        }
        /* Правое ушко */
        .cat-scanner::after {
            content: '';
            position: absolute;
            top: -20px; right: 10px;
            width: 0; height: 0;
            border-right: 25px solid transparent;
            border-left: 15px solid transparent;
            border-bottom: 35px solid #ffffff;
            transform: rotate(15deg);
        }
        .cat-scanner:hover {
            border-color: #ff007f;
            box-shadow: 0 0 35px #ff007f;
        }
        .status {
            margin-top: 50px;
            letter-spacing: 4px;
            font-size: 13px;
            text-transform: uppercase;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
